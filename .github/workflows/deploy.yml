name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          # 古い puppeteer の Chromium 配信が 403 になるため、CIではスキップ
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

      - name: Setup Chrome for react-snap
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Build
        run: npm run build
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify Bing via IndexNow
        run: |
          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d '{
              "host": "smileys.one",
              "key": "smileys-kennel-indexnow-2026",
              "keyLocation": "https://smileys.one/smileys-kennel-indexnow-2026.txt",
              "urlList": [
                "https://smileys.one/",
                "https://smileys.one/sitemap.xml"
              ]
            }' || true
